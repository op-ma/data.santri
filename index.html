.mpan{border-color:var(--gold2);box-shadow:0 12px 40px rgba(2,44,34,.3)}
.mh button{color:var(--b2);border-color:var(--gold2)}
nav{border-bottom:1px solid var(--gold2);background:#fffefa}
.tab:hover{color:var(--b1)}
.tab.on{color:var(--b2);border-color:var(--gold);border-bottom-width:3px}
.k{border-left-color:var(--b2);background:linear-gradient(180deg,#fff,#fbfcf8)}
